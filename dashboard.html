
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIGVEE Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #172033;
    }
    .container { max-width: 750px; margin: auto; }
    header {
      background: #073b2a;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 6px; font-size: 23px; }
    h2 { font-size: 19px; }
    .panel {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0000000c;
    }
    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 7px;
      font-size: 15px;
    }
    input, textarea {
      border: 1px solid #ccd3dc;
      background: white;
    }
    textarea { min-height: 85px; resize: vertical; }
    button {
      border: 0;
      background: #087443;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .logout { background: #555; }
    .delete { background: #b42318; }
    .edit { background: #2457a7; }
    .product {
      border: 1px solid #e0e5eb;
      padding: 12px;
      border-radius: 9px;
      margin: 12px 0;
    }
    .product img {
      width: 100%;
      max-height: 210px;
      object-fit: contain;
      background: #f4f4f4;
      border-radius: 7px;
    }
    #status { font-size: 14px; white-space: pre-wrap; }
    .muted { color: #667085; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>BIGVEE Medical Stores</h1>
    <p>Admin Dashboard</p>
  </header>

  <section class="panel">
    <h2>Add New Product</h2>
    <form id="productForm">
      <input id="name" placeholder="Product name" required>
      <textarea id="description" placeholder="Product description"></textarea>
      <input id="category" placeholder="Category (e.g. Hospital Beds)" required>
      <input id="price" type="number" min="0" step="0.01" placeholder="Price in Naira" required>

      <label for="imageFile"><strong>Choose product picture from Gallery</strong></label>
      <input id="imageFile" type="file" accept="image/*" required>
      <p class="muted">Choose an image from your phone. Maximum size: 5 MB.</p>

      <button id="saveButton" type="submit">Upload and Add Product</button>
    </form>
    <p id="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <h2>Products in Your Store</h2>
    <div id="products">Loading products...</div>
  </section>

  <button class="logout" id="logoutButton">Log Out</button>
</div>

<script>
const SUPABASE_URL = "https://mvrvbpdfoqvsyuibrwzs.supabase.co";
const SUPABASE_KEY = "sb_publishable_deplKvStHA5PrK5oXaFlCA_TX_L-DEd";
const BUCKET = "BIGVEE medical";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusBox = document.getElementById("status");
const form = document.getElementById("productForm");
const saveButton = document.getElementById("saveButton");
const productsBox = document.getElementById("products");

function showStatus(message) {
  statusBox.textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

async function checkAdmin() {
  const { data: sessionData, error: sessionError } =
    await db.auth.getSession();

  if (sessionError || !sessionData.session) {
    location.href = "admin.html";
    return false;
  }

  const { data: admin, error } = await db
    .from("admin_users")
    .select("role")
    .eq("user_id", sessionData.session.user.id)
    .maybeSingle();

  if (error || !admin || admin.role !== "admin") {
    await db.auth.signOut();
    alert("Admin access not verified.");
    location.href = "admin.html";
    return false;
  }

  return true;
}

async function loadProducts() {
  productsBox.textContent = "Loading products...";

  const { data, error } = await db
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    productsBox.textContent = "Could not load products: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    productsBox.textContent = "No products added yet.";
    return;
  }

  productsBox.innerHTML = data.map(product => `
    <div class="product">
      ${product.image_url ? `
        <img src="${escapeHTML(product.image_url)}" alt="${escapeHTML(product.name)}">
      ` : ""}
      <h3>${escapeHTML(product.name)}</h3>
      <p>${escapeHTML(product.description || "")}</p>
      <p><strong>Category:</strong> ${escapeHTML(product.category || "")}</p>
      <p><strong>Price:</strong> ₦${Number(product.price || 0).toLocaleString("en-NG")}</p>
      <button class="edit" onclick="editProduct('${product.id}')">Edit Product</button>
      <button class="delete" onclick="deleteProduct('${product.id}')">Delete Product</button>
    </div>
  `).join("");
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const description = document.getElementById("description").value.trim();
  const category = document.getElementById("category").value.trim();
  const price = Number(document.getElementById("price").value);
  const file = document.getElementById("imageFile").files[0];

  if (!file) {
    showStatus("Please choose a product picture.");
    return;
  }

  if (!file.type.startsWith("image/")) {
    showStatus("Please choose a valid image.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showStatus("Image is too large. Please choose an image under 5 MB.");
    return;
  }

  if (!Number.isFinite(price) || price < 0) {
    showStatus("Please enter a valid price.");
    return;
  }

  saveButton.disabled = true;

  try {
    showStatus("Uploading picture...");

    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "-");
    const path = `${crypto.randomUUID()}-${safeName}`;

    const { data: uploaded, error: uploadError } =
      await db.storage.from(BUCKET).upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (uploadError) throw uploadError;

    const { data: publicData } =
      db.storage.from(BUCKET).getPublicUrl(uploaded.path);

    const { error: insertError } = await db
      .from("products")
      .insert([{
        name,
        description,
        category,
        price,
        image_url: publicData.publicUrl,
        is_available: true
      }]);

    if (insertError) throw insertError;

    showStatus("Product uploaded successfully!");
    form.reset();
    await loadProducts();

  } catch (error) {
    showStatus("Error: " + error.message);
  } finally {
    saveButton.disabled = false;
  }
});

async function editProduct(id) {
  const { data: product, error } = await db
    .from("products")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !product) {
    alert("Could not find this product.");
    return;
  }

  const name = prompt("Product name:", product.name);
  if (name === null) return;

  const description = prompt("Description:", product.description || "");
  if (description === null) return;

  const category = prompt("Category:", product.category || "");
  if (category === null) return;

  const priceText = prompt("Price in Naira:", product.price);
  if (priceText === null) return;

  const price = Number(priceText);

  if (!name.trim() || !category.trim() || !Number.isFinite(price) || price < 0) {
    alert("Please enter a valid name, category and price.");
    return;
  }

  const { error: updateError } = await db
    .from("products")
    .update({
      name: name.trim(),
      description: description.trim(),
      category: category.trim(),
      price
    })
    .eq("id", id);

  if (updateError) {
    alert("Update failed: " + updateError.message);
    return;
  }

  alert("Product updated successfully.");
  await loadProducts();
}

async function deleteProduct(id) {
  if (!confirm("Are you sure you want to delete this product?")) return;

  const { error } = await db
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Delete failed: " + error.message);
    return;
  }

  alert("Product deleted.");
  await loadProducts();
}

document.getElementById("logoutButton").addEventListener("click", async () => {
  await db.auth.signOut();
  location.href = "admin.html";
});

(async function startDashboard() {
  const allowed = await checkAdmin();
  if (allowed) await loadProducts();
})();
</script>
</body>
</html>
