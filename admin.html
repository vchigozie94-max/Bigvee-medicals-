
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIGVEE Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172b45}
header{background:#123c69;color:white;padding:20px}
header h2{margin:0}
main{max-width:950px;margin:25px auto;padding:15px}
.panel,.order{background:white;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #0000000b}
input,button,select{width:100%;padding:12px;margin-top:10px;border-radius:7px;border:1px solid #ccd5df;font-size:15px}
button{background:#123c69;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#64748b}
button:disabled{opacity:.5}
.hidden{display:none}
.muted{color:#64748b;font-size:13px}
.order h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.status{font-weight:bold;color:#123c69}
#message{white-space:pre-wrap;color:#b42318}
#login{max-width:390px;margin:55px auto}
#login h2{text-align:center;color:#123c69}
.item{border-top:1px solid #e2e8f0;padding:9px 0;font-size:14px}
</style>
</head>
<body>

<header>
  <h2>BIGVEE MEDICAL STORES</h2>
  <p>Administrator Dashboard</p>
</header>

<main>
  <section id="login" class="panel">
    <h2>Administrator Login</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>
    <p id="loginMessage" class="muted"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <div class="row">
        <div>
          <h2>Orders</h2>
          <p class="muted">Manage customer orders</p>
        </div>
        <div>
          <button id="refreshBtn">REFRESH ORDERS</button>
          <button id="logoutBtn" class="secondary">LOG OUT</button>
        </div>
      </div>
      <h3 id="orderCount">Loading orders...</h3>
      <p id="dashboardMessage" class="muted"></p>
    </div>
    <div id="orders"></div>
  </section>
</main>

<script>
const db = window.supabase.createClient(
  "https://mvrvbpdfoqvsyuibrwzs.supabase.co",
  "sb_publishable_deplKvStHA5PrK5oXaFlCA_TX_L-DEd"
);

const $ = id => document.getElementById(id);

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function money(value) {
  return "₦" + Number(value || 0).toLocaleString("en-NG");
}

async function verifyAdmin() {
  const {data:{session}} = await db.auth.getSession();

  if (!session) return false;

  const {data:admin,error} = await db
    .from("admin_users")
    .select("role")
    .eq("user_id",session.user.id)
    .eq("role","admin")
    .maybeSingle();

  if (error || !admin) {
    await db.auth.signOut();
    return false;
  }

  return true;
}

async function showDashboard() {
  const allowed = await verifyAdmin();

  if (!allowed) {
    $("dashboard").classList.add("hidden");
    $("login").classList.remove("hidden");
    return;
  }

  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  await loadOrders();
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginMessage").textContent = "Checking login...";

  const {error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  if (error) {
    $("loginMessage").textContent = error.message;
    return;
  }

  const allowed = await verifyAdmin();

  if (!allowed) {
    $("loginMessage").textContent =
      "This account is not an authorized administrator.";
    return;
  }

  await showDashboard();
});

async function loadOrders() {
  $("dashboardMessage").textContent = "Loading orders...";
  $("orderCount").textContent = "Loading...";
  $("orders").innerHTML = "";

  const {data,error} = await db
    .from("orders")
    .select("id,customer_name,customer_phone,delivery_address,notes,total,status,created_at")
    .order("created_at",{ascending:false});

  if (error) {
    $("dashboardMessage").textContent =
      "Could not load orders: " + error.message;
    $("orderCount").textContent = "Orders unavailable";
    return;
  }

  $("dashboardMessage").textContent = "";
  $("orderCount").textContent = "Total orders: " + data.length;

  if (!data.length) {
    $("orders").innerHTML =
      '<div class="panel">No orders found yet.</div>';
    return;
  }

  data.forEach(order => {
    const card = document.createElement("div");
    card.className = "order";

    const date = order.created_at
      ? new Date(order.created_at).toLocaleString()
      : "Date unavailable";

    card.innerHTML = `
      <h3>Order #${safe(order.id)}</h3>
      <p><b>Customer:</b> ${safe(order.customer_name)}</p>
      <p><b>Phone:</b> ${safe(order.customer_phone)}</p>
      <p><b>Delivery address:</b> ${safe(order.delivery_address)}</p>
      <p><b>Total:</b> ${money(order.total)}</p>
      <p><b>Date:</b> ${safe(date)}</p>
      <p><b>Notes:</b> ${safe(order.notes || "None")}</p>
      <p class="status">Current status: ${safe(order.status || "pending")}</p>
      <div class="item" id="items-${safe(order.id)}">Order items not loaded.</div>
      <button class="itemsBtn">VIEW ORDER ITEMS</button>
      <div class="row">
        <select class="statusSelect">
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="processing">Processing</option>
          <option value="dispatched">Dispatched</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="updateBtn">UPDATE STATUS</button>
      </div>
      <p class="muted result"></p>
    `;

    const select = card.querySelector(".statusSelect");
    select.value = order.status || "pending";

    card.querySelector(".itemsBtn").addEventListener("click", async () => {
      const target = card.querySelector(".item");
      target.textContent = "Loading order items...";

      const {data:items,error:itemError} = await db
        .from("order_items")
        .select("product_name,quantity,unit_price,subtotal")
        .eq("order_id",order.id);

      if (itemError) {
        target.textContent = "Could not load items: " + itemError.message;
        return;
      }

      if (!items.length) {
        target.textContent = "No order items found.";
        return;
      }

      target.innerHTML = items.map(item => `
        <div class="item">
          <b>${safe(item.product_name)}</b><br>
          Quantity: ${safe(item.quantity)}<br>
          Unit price: ${money(item.unit_price)}<br>
          Subtotal: ${money(item.subtotal)}
        </div>
      `).join("");
    });

    card.querySelector(".updateBtn").addEventListener("click", async () => {
      const result = card.querySelector(".result");
      const newStatus = select.value;

      if (!confirm("Update this order to " + newStatus + "?")) return;

      result.textContent = "Updating...";

      const {error:updateError} = await db
        .from("orders")
        .update({status:newStatus})
        .eq("id",order.id);

      if (updateError) {
        result.textContent = "Update failed: " + updateError.message;
        return;
      }

      result.textContent = "Order status updated successfully.";
      card.querySelector(".status").textContent =
        "Current status: " + newStatus;
    });

    $("orders").appendChild(card);
  });
}

$("refreshBtn").addEventListener("click",loadOrders);

$("logoutBtn").addEventListener("click",async () => {
  await db.auth.signOut();
  $("dashboard").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("loginMessage").textContent = "You have logged out.";
});

db.auth.onAuthStateChange((_event,session) => {
  if (!session) {
    $("dashboard").classList.add("hidden");
    $("login").classList.remove("hidden");
  }
});

showDashboard();
</script>
</body>
</html>
