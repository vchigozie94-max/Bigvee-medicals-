
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGVEE Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f5fa;
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
}
.login {
  background: white;
  padding: 28px;
  border-radius: 14px;
  width: min(85%, 360px);
  box-shadow: 0 4px 20px #0001;
}
h2 { color: #123c69; text-align: center; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border-radius: 7px;
}
input { border: 1px solid #ccc; }
button {
  background: #123c69;
  color: white;
  border: 0;
  font-weight: bold;
}
#message { text-align: center; font-size: 14px; }
</style>
</head>
<body>
<div class="login">
  <h2>BIGVEE MEDICAL STORES</h2>
  <p style="text-align:center">Administrator Login</p>

  <form id="loginForm">
    <input id="email" type="email" placeholder="Admin email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">LOGIN</button>
  </form>
  <p id="message"></p>
</div>

<script>
const db = window.supabase.createClient(
  "https://mvrvbpdfoqvsyuibrwzs.supabase.co",
  "sb_publishable_deplKvStHA5PrK5oXaFlCA_TX_L-DEd"
);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = document.getElementById("message");
  message.textContent = "Checking login...";

  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  const { data: admin, error: adminError } = await db
    .from("admin_users")
    .select("role")
    .eq("user_id", data.user.id)
    .eq("role", "admin")
    .maybeSingle();

  if (adminError || !admin) {
    await db.auth.signOut();
    message.textContent = "This account is not an authorized administrator.";
    return;
  }

  message.textContent = "Login successful! Admin access verified.";
});
</script>
</body>
</html>
